<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VOBB — Five Warlords</title>
<style>
:root {
  --bg: #06060f;
  --bg2: #0c0c1a;
  --surface: #12122a;
  --surface2: #1a1a40;
  --surface3: #252560;
  --border: #1e1e4a;
  --border2: #2a2a6a;
  --text: #eee;
  --text2: #aab;
  --gold: #f4c430;
  --red: #ff3860;
  --green: #23d160;
  --blue: #3298dc;
  --purple: #b86bff;
  --cyan: #00d1b2;
  --pink: #ff3860;
  --orange: #ff6b35;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* === Reset === */
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
.hidden { display: none !important; }

/* === App === */
.app { min-height: 100vh; display: flex; flex-direction: column; }

/* === Top Bar === */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: linear-gradient(180deg, rgba(18,18,42,.98), rgba(12,12,30,.95));
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 200;
}
.topbar-left { display: flex; align-items: center; gap: 8px; }
.btn-back {
  width: 32px; height: 32px; border-radius: 8px; background: var(--surface);
  border: 1px solid var(--border); color: var(--text2); display: flex; align-items: center;
  justify-content: center; font-size: 1rem;
}
.btn-back:active { background: var(--surface2); }
.topbar-title { font-size: .75rem; color: var(--text2); font-weight: 600; letter-spacing: 1px; }
.topbar-right { display: flex; gap: 6px; }
.res {
  display: flex; align-items: center; gap: 4px; padding: 4px 10px;
  border-radius: 16px; background: var(--surface); border: 1px solid var(--border);
  font-size: .75rem; font-weight: 700;
}
.res.gems { color: var(--cyan); }
.res.gold { color: var(--gold); }
.res.stam { color: var(--green); }

/* === Main Layout === */
.main { flex: 1; display: flex; flex-direction: column; position: relative; }

/* === Character Portrait === */
.portrait {
  position: relative; width: 100%; height: 340px;
  background: linear-gradient(180deg, #0d0825 0%, #1a1040 40%, #0d0825 100%);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.portrait::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 70%, rgba(180,100,255,.2) 0%, transparent 50%);
  pointer-events: none;
}
.portrait-art {
  font-size: 9rem; z-index: 2; filter: drop-shadow(0 0 40px rgba(180,100,255,.5));
  animation: hover 3s ease-in-out infinite;
}
@keyframes hover { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.portrait-info {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px;
  background: linear-gradient(0deg, rgba(0,0,0,.8) 0%, transparent 100%);
  display: flex; flex-direction: column; gap: 4px;
}
.portrait-name { font-size: 1.4rem; font-weight: 800; color: #fff; letter-spacing: .5px; }
.portrait-sub { font-size: .75rem; color: var(--text2); display: flex; align-items: center; gap: 6px; }
.portrait-stars { color: var(--gold); letter-spacing: 1px; font-size: .8rem; }
.portrait-rar { padding: 1px 8px; border-radius: 8px; font-size: .65rem; font-weight: 700; background: rgba(255,255,255,.1); }
.portrait-rar.ssr { color: var(--gold); }
.portrait-rar.sr { color: var(--purple); }
.portrait-rar.r { color: var(--blue); }
.portrait-lv { font-size: .8rem; font-weight: 700; color: var(--cyan); }
.portrait-exp { width: 120px; height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; margin-top: 2px; }
.portrait-exp-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple)); border-radius: 2px; }
.faction-badge {
  position: absolute; top: 12px; right: 12px; padding: 4px 12px; border-radius: 12px;
  font-size: .65rem; font-weight: 700; letter-spacing: 1px; background: rgba(0,0,0,.5);
  backdrop-filter: blur(8px); border: 1px solid;
}
.faction-T { color: var(--purple); border-color: var(--purple); }
.faction-P { color: var(--orange); border-color: var(--orange); }
.faction-W { color: var(--green); border-color: var(--green); }
.faction-U { color: var(--blue); border-color: var(--blue); }
.faction-C { color: var(--red); border-color: var(--red); }

/* === Roster (Left) === */
.roster {
  position: fixed; left: 0; top: 52px; bottom: 0; width: 64px;
  background: linear-gradient(180deg, rgba(16,16,36,.98), rgba(10,10,24,.98));
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  align-items: center; padding: 8px 0; gap: 6px; overflow-y: auto; z-index: 100;
}
.roster-item {
  width: 48px; height: 60px; border-radius: 8px; background: var(--surface);
  border: 2px solid var(--border); cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px; transition: all .2s; flex-shrink: 0;
}
.roster-item:active { transform: scale(.95); }
.roster-item.active { border-color: var(--gold); box-shadow: 0 0 12px rgba(244,196,48,.3); }
.roster-avatar { font-size: 1.4rem; }
.roster-lv { font-size: .55rem; font-weight: 700; color: var(--text2); }
.roster-item.active .rost-lv { color: var(--gold); }
.roster-sep { width: 32px; height: 1px; background: var(--border); margin: 2px 0; flex-shrink: 0; }
.roster-sort {
  width: 36px; height: 36px; border-radius: 50%; background: var(--surface);
  border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center;
  color: var(--text2); margin-top: auto; flex-shrink: 0; font-size: .8rem;
}

/* === Detail Panel === */
.detail {
  padding: 12px 12px 12px 76px; background: var(--bg2);
  display: flex; flex-direction: column; gap: 10px;
}

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); }
.tab {
  padding: 8px 16px; font-size: .75rem; font-weight: 600; color: var(--text2);
  position: relative; background: none; border: none;
}
.tab.active { color: var(--text); }
.tab.active::after {
  content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px;
  background: var(--cyan);
}

/* Power */
.power {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  background: linear-gradient(135deg, rgba(180,100,255,.12), rgba(0,200,255,.06));
  border: 1px solid rgba(180,100,255,.2); border-radius: 10px;
}
.power-label { font-size: .6rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
.power-val { font-size: 1.8rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 15px rgba(244,196,48,.3); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 4px; text-align: center;
}
.stat-icon { font-size: .9rem; margin-bottom: 2px; }
.stat-name { font-size: .55rem; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 1px; }
.stat-val { font-size: .85rem; font-weight: 700; }
.stat-val.hp { color: var(--green); }
.stat-val.atk { color: var(--red); }
.stat-val.def { color: var(--blue); }
.stat-val.spd { color: var(--cyan); }
.stat-val.crit { color: var(--orange); }

/* Skills */
.row { display: flex; gap: 8px; }
.row-title { font-size: .7rem; color: var(--text2); font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }

.skills { gap: 8px; justify-content: space-between; }
.skill { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.skill-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 1rem; border: 2px solid var(--border2); }
.skill-name { font-size: .55rem; color: var(--text2); text-align: center; }
.skill-lv { font-size: .55rem; font-weight: 700; color: var(--gold); }

/* Equipment */
.equips { gap: 6px; }
.equip { flex: 1; max-width: 60px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; }
.equip.has { border-style: solid; border-color: var(--blue); background: linear-gradient(135deg, var(--surface), rgba(50,152,220,.1)); }
.equip-icon { font-size: 1.1rem; }
.equip-lv { font-size: .5rem; color: var(--text2); }
.equip-stars { font-size: .45rem; color: var(--gold); letter-spacing: 1px; }

/* Upgrade Button */
.btn-upgrade {
  width: 100%; padding: 12px; border-radius: 10px; font-size: .9rem; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  background: linear-gradient(135deg, var(--blue), var(--purple)); color: #fff;
  box-shadow: 0 4px 15px rgba(180,100,255,.3); transition: all .2s;
}
.btn-upgrade:active { transform: scale(.98); }

/* Bottom Bar */
.bottom {
  display: flex; justify-content: center; gap: 24px; padding: 12px 12px 16px 76px;
  background: linear-gradient(0deg, rgba(10,10,24,.98), rgba(10,10,24,.95));
}
.bot-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 14px; border-radius: 8px; background: none; }
.bot-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
.bot-label { font-size: .55rem; color: var(--text2); font-weight: 600; }
.bot-btn:active .bot-icon { background: var(--surface2); }

/* === Login === */
.login {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; background: radial-gradient(circle at 50% 30%, #1a1040 0%, #06060f 70%);
}
.login-logo { font-size: 4rem; margin-bottom: 12px; }
.login-title { font-size: 2.2rem; font-weight: 900; background: linear-gradient(135deg, var(--gold), #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px; margin-bottom: 4px; }
.login-sub { font-size: .75rem; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px; }
.login-btn {
  padding: 14px 48px; border-radius: 24px; font-size: .9rem; font-weight: 700; letter-spacing: 2px;
  background: linear-gradient(135deg, var(--gold), #e6a817); color: #000; text-transform: uppercase;
  box-shadow: 0 4px 20px rgba(244,196,48,.3);
}
.login-btn:active { transform: scale(.96); }

/* === Loading & Toast === */
.loading {
  position: fixed; inset: 0; background: rgba(6,6,15,.9); display: flex;
  align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(8px);
}
.loading div { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  padding: 8px 20px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--gold);
  font-size: .75rem; z-index: 1001; animation: fade .3s;
}
@keyframes fade { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* === Responsive === */
@media (min-width: 768px) {
  .portrait { height: 420px; }
  .portrait-art { font-size: 12rem; }
  .roster { width: 72px; }
  .detail, .bottom { padding-left: 88px; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Loading -->
  <div class="loading hidden" id="loading"><div></div></div>

  <!-- Login -->
  <div class="login hidden" id="login">
    <div class="login-logo">⚔️</div>
    <div class="login-title">VOBB</div>
    <div class="login-sub">Five Warlords</div>
    <button class="login-btn" onclick="guestLogin()">Enter as Guest</button>
  </div>

  <!-- Game -->
  <div id="game">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-back" onclick="showSection('chars')">←</button>
        <span class="topbar-title">Overview</span>
      </div>
      <div class="topbar-right">
        <div class="res gems"><span>💎</span><span id="gems">0</span></div>
        <div class="res gold"><span>🪙</span><span id="gold">0</span></div>
        <div class="res stam"><span>⚡</span><span id="stam">0</span></div>
      </div>
    </div>

    <div class="main">
      <!-- Roster -->
      <aside class="roster" id="roster"></aside>

      <!-- Content -->
      <div style="margin-left: 64px;">
        <!-- Portrait -->
        <div class="portrait">
          <div class="portrait-art" id="art">🧬</div>
          <div class="portrait-info">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="portrait-name" id="name">—</span>
              <span class="portrait-rar" id="rar">SSR</span>
            </div>
            <div class="portrait-sub">
              <span class="portrait-stars" id="stars">★★★★★</span>
              <span id="title">—</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:2px;">
              <span class="portrait-lv" id="lv">Lv.1</span>
              <div class="portrait-exp"><div class="portrait-exp-fill" id="expbar" style="width:0%"></div></div>
            </div>
          </div>
          <div class="faction-badge" id="fact">TRANSCENDENT</div>
        </div>

        <!-- Detail -->
        <div class="detail">
          <div class="tabs">
            <button class="tab active" data-t="overview" onclick="switchTab('overview')">Overview</button>
            <button class="tab" data-t="skills" onclick="switchTab('skills')">Skills</button>
            <button class="tab" data-t="equip" onclick="switchTab('equip')">Equipment</button>
            <button class="tab" data-t="evo" onclick="switchTab('evo')">Evolution</button>
          </div>

          <!-- Overview -->
          <div id="p-overview">
            <div class="power">
              <span class="power-label">POWER</span>
              <span class="power-val" id="power">0</span>
            </div>
            <div class="stats" id="stats"></div>
            <div class="row skills" id="skills"></div>
            <div class="row equips" id="equips"></div>
            <button class="btn-upgrade" style="margin-top:10px;" onclick="upgrade()">⬆ Upgrade</button>
          </div>

          <div id="p-skills" class="hidden"><div class="row" style="flex-wrap:wrap;gap:8px;"><div style="width:100%;color:var(--text2);font-size:.75rem;">Coming soon</div></div></div>
          <div id="p-equip" class="hidden"><div style="color:var(--text2);font-size:.75rem;">Coming soon</div></div>
          <div id="p-evo" class="hidden"><div style="color:var(--text2);font-size:.75rem;">Coming soon</div></div>
        </div>

        <!-- Bottom -->
        <div class="bottom">
          <button class="bot-btn" onclick="showSection('form')"><div class="bot-icon">🛡️</div><span class="bot-label">Formation</span></button>
          <button class="bot-btn" onclick="toast('Locked')"><div class="bot-icon">🔒</div><span class="bot-label">Lock</span></button>
          <button class="bot-btn" onclick="toast('Story')"><div class="bot-icon">📖</div><span class="bot-label">Story</span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '/api';
const EMOJI = { TRANSCENDENT:'🧬', PURIST:'⚔️', WILD:'🐺', UNKNOWN:'👁️', CYBERIST:'🤖' };
const FCLASS = { TRANSCENDENT:'faction-T', PURIST:'faction-P', WILD:'faction-W', UNKNOWN:'faction-U', CYBERIST:'faction-C' };
const STARS = { SSR:5, SR:4, R:3, N:2 };

let state = { accessToken:null, refreshToken:null, player:null, chars:[], idx:0 };

async function api(p, o={}) {
  const h = {'Content-Type':'application/json',...o.headers};
  if (state.accessToken) h['Authorization'] = 'Bearer '+state.accessToken;
  let r = await fetch(API+p,{...o,headers:h});
  if (r.status===401 && state.refreshToken) {
    await refresh(); h['Authorization']='Bearer '+state.accessToken;
    r = await fetch(API+p,{...o,headers:h});
  }
  const d = await r.json();
  if (!r.ok) throw new Error(d.message||d.error||'Error');
  return d;
}

async function guestLogin() {
  showLoading();
  try {
    const d = await api('/auth/guest',{method:'POST',body:JSON.stringify({playerName:'Hunter'})});
    state.accessToken=d.accessToken; state.refreshToken=d.refreshToken;
    state.player=d.player||d.user?.player;
    document.getElementById('login').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    await load();
  } catch(e) { toast(e.message); }
  hideLoading();
}

async function refresh() {
  try {
    const d = await api('/auth/refresh',{method:'POST',body:JSON.stringify({refreshToken:state.refreshToken})});
    state.accessToken=d.accessToken; return true;
  } catch { return false; }
}

async function load() {
  try { state.player = await api('/player/me'); } catch(e){}
  try { state.chars = await api('/characters/mine'); } catch(e){ state.chars=[]; }
  renderRes(); renderAll();
}

function renderRes() {
  const c = state.player?.currencies||[];
  const g = c.find(x=>x.type==='gold'), gm = c.find(x=>x.type='gems'), s = c.find(x=>x.type==='stamina');
  document.getElementById('gold').textContent = fmt(g?.amount||0);
  document.getElementById('gems').textContent = fmt(gm?.amount||0);
  document.getElementById('stam').textContent = (s?.amount||0)+'/'+(state.player?.staminaMax||100);
}

function fmt(n) {
  if (n>=1e6) return (n/1e6).toFixed(1)+'M';
  if (n>=1e3) return (n/1e3).toFixed(1)+'K';
  return n.toString();
}

function renderAll() {
  const c = state.chars[state.idx];
  if (!c) return;
  const ch = c.character||c;

  document.getElementById('art').textContent = EMOJI[ch.faction]||'❓';
  document.getElementById('name').textContent = ch.name;
  document.getElementById('title').textContent = ch.title||ch.name;
  document.getElementById('rar').textContent = ch.rarity;
  document.getElementById('rar').className = 'portrait-rar '+(ch.rarity||'').toLowerCase();
  document.getElementById('stars').textContent = '★'.repeat(STARS[ch.rarity]||3);
  document.getElementById('lv').textContent = 'Lv.'+(c.level||1)+'/60';
  document.getElementById('expbar').style.width = Math.min(100,((c.exp||0)/(c.expMax||100))*100)+'%';
  const fb = document.getElementById('fact');
  fb.textContent = ch.faction;
  fb.className = 'faction-badge '+(FCLASS[ch.faction]||'');

  // Power
  const pwr = Math.floor((c.currentHp||ch.baseHp||1000)/10 + (c.currentAtk||ch.baseAtk||100)*3 + (c.currentDef||ch.baseDef||100)*2);
  document.getElementById('power').textContent = fmt(pwr);

  // Stats
  const st = [
    {n:'HP',v:c.currentHp||ch.baseHp||0,i:'❤️',c:'hp'},
    {n:'ATK',v:c.currentAtk||ch.baseAtk||0,i:'⚔️',c:'atk'},
    {n:'DEF',v:c.currentDef||ch.baseDef||0,i:'🛡️',c:'def'},
    {n:'SPD',v:c.currentAgi||ch.baseAgi||0,i:'⚡',c:'spd'},
    {n:'CRIT',v:(c.crit||15)+'%',i:'💥',c:'crit'},
  ];
  document.getElementById('stats').innerHTML = st.map(s=>`
    <div class="stat"><div class="stat-icon">${s.i}</div><div class="stat-name">${s.n}</div><div class="stat-val ${s.c}">${fmt(s.v)}</div></div>
  `).join('');

  // Skills
  const sk = [
    {n:'Normal ATK',i:'⚔️',l:c.skillLv||3},
    {n:'Skill 1',i:'🔮',l:c.skillLv||3},
    {n:'Skill 2',i:'💫',l:Math.max(1,(c.skillLv||3)-1)},
    {n:'Ultimate',i:'✨',l:Math.max(1,(c.skillLv||3)-2)},
  ];
  document.getElementById('skills').innerHTML = sk.map(s=>`
    <div class="skill"><div class="skill-icon">${s.i}</div><div class="skill-name">${s.n}</div><div class="skill-lv">Lv.${s.l}</div></div>
  `).join('');

  // Equipment
  const eq = [
    {n:'Weapon',i:'⚔️',l:40,s:2},
    {n:'Helmet',i:'🪖',l:35,s:3},
    {n:'Ring',i:'💍',l:30,s:3},
    {n:'Boots',i:'👢',l:28,s:3},
  ];
  document.getElementById('equips').innerHTML = eq.map(e=>`
    <div class="equip has"><div class="equip-icon">${e.i}</div><div class="equip-lv">Lv.${e.l}</div><div class="equip-stars">${'★'.repeat(e.s)}</div></div>
  `).join('');

  // Roster
  document.getElementById('roster').innerHTML = state.chars.map((rc,i)=>{
    const rch = rc.character||rc;
    return `<div class="roster-item ${i===state.idx?'active':''}" onclick="select(${i})"><div class="roster-avatar">${EMOJI[rch.faction]||'❓'}</div><div class="roster-lv">Lv.${rc.level||1}</div></div>`;
  }).join('')+'<div class="roster-sep"></div><div class="roster-sort" onclick="sortRoster()">⇅</div>';
}

function select(i) { state.idx = i; renderAll(); }
function sortRoster() { state.chars.sort((a,b)=>(b.level||1)-(a.level||1)); renderAll(); }

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.t===t));
  ['overview','skills','equip','evo'].forEach(x=>{
    document.getElementById('p-'+x).classList.toggle('hidden',x!==t);
  });
}

function upgrade() { toast('Coming soon'); }
function showSection(s) { toast(s+' - Coming soon'); }
function showLoading(){document.getElementById('loading').classList.remove('hidden');}
function hideLoading(){document.getElementById('loading').classList.add('hidden');}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2000);}
</script>
