<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOBB — Babylon Preview</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;padding:0;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#renderCanvas{width:100vw;height:100vh;display:block;touch-action:none}

/* === HUD Overlay === */
#hud{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
#hud *{pointer-events:auto}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(18,18,42,.4);border-bottom:2px solid rgba(255,255,255,.15);backdrop-filter:blur(8px)}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-title{font-size:.975rem;color:#fff;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.btn-icon{width:42px;height:42px;border-radius:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;cursor:pointer}
.btn-icon:hover{background:rgba(255,255,255,.2)}
.res-bar{display:flex;align-items:center;gap:6px}
.res{display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:4px;background:rgba(255,255,255,.1);font-size:.9rem;font-weight:700;color:#fff}

.bottom-bar{position:absolute;bottom:0;left:0;right:0;padding:12px 24px;background:rgba(18,18,42,.4);border-top:2px solid rgba(255,255,255,.15);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between}
.bottom-left{display:flex;gap:8px}
.info-card{padding:8px 16px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:4px}
.info-label{font-size:.55rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px}
.info-val{font-size:1rem;font-weight:700;color:#fff}
.faction-badge{padding:4px 12px;border-radius:4px;font-size:.6rem;font-weight:700;background:rgba(0,0,0,.4);border:1px solid}

.side-panel{position:absolute;top:80px;right:20px;width:200px;padding:16px;background:rgba(18,18,42,.6);border:1px solid rgba(255,255,255,.1);border-radius:8px;backdrop-filter:blur(8px)}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.stat-row:last-child{border-bottom:none}
.stat-name{font-size:.65rem;color:rgba(255,255,255,.5)}
.stat-val{font-size:.85rem;font-weight:700;color:#fff}

.btn{width:100%;padding:10px;border-radius:6px;font-size:.75rem;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.2);color:#fff;margin-top:8px}
.btn-primary{background:rgba(50,152,220,.4);border-color:rgba(50,152,220,.6)}
.btn-primary:hover{background:rgba(50,152,220,.6)}
.btn-gold{background:rgba(244,196,48,.3);border-color:rgba(244,196,48,.6);color:#000}
.btn-gold:hover{background:rgba(244,196,48,.5)}

.layer-panel{position:absolute;bottom:80px;right:20px;display:flex;gap:4px;padding:8px;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.2);border-radius:6px;flex-wrap:wrap;max-width:300px;justify-content:flex-end}
.layer-btn{padding:4px 8px;font-size:.55rem;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:3px;cursor:pointer}
.layer-btn.active{background:rgba(0,209,178,.3)}
.layer-btn:hover{background:rgba(255,255,255,.2)}

.char-select{position:absolute;top:80px;left:20px;display:flex;flex-direction:column;gap:6px}
.char-thumb{width:60px;height:60px;border-radius:4px;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.2);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.char-thumb:hover{border-color:rgba(255,255,255,.5)}
.char-thumb.active{border-color:#f4c430;box-shadow:0 0 8px rgba(244,196,48,.4)}
.char-thumb .lv{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:.45rem;color:#fff;text-align:center;padding:1px 0}
.char-thumb .fact{position:absolute;top:1px;right:2px;font-size:.5rem;font-weight:800;font-family:monospace}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<div id="hud">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="btn-icon" id="btnMenu">☰</button>
      <span class="topbar-title" id="title">Character</span>
    </div>
    <div class="res-bar">
      <div class="res"><span>💎</span><span id="gems">3.0K</span></div>
      <div class="res"><span>🪙</span><span id="gold">5.0K</span></div>
      <div class="res"><span>⚡</span><span id="stam">100/100</span></div>
    </div>
  </div>

  <!-- Character Select -->
  <div class="char-select" id="charSelect"></div>

  <!-- Side Panel -->
  <div class="side-panel">
    <div class="info-card" style="margin-bottom:8px">
      <div class="info-label">POWER</div>
      <div class="info-val" id="powerVal">16,635</div>
    </div>
    <div id="statsList"></div>
    <button class="btn btn-primary" id="btnUpgrade">UPGRADE</button>
    <button class="btn btn-gold" id="btnGacha">PULL ×10</button>
  </div>

  <!-- Layer Panel -->
  <div class="layer-panel" id="layerPanel">
    <button class="layer-btn active" data-layer="scene">3D</button>
    <button class="layer-btn active" data-layer="particles">FX</button>
    <button class="layer-btn active" data-layer="hud">HUD</button>
    <button class="layer-btn active" data-layer="bg">BG</button>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="bottom-left">
      <div class="info-card"><div class="info-label">Name</div><div class="info-val" id="charName">Adaptive Stalker</div></div>
      <div class="info-card"><div class="info-label">Level</div><div class="info-val" id="charLv">100</div></div>
      <div class="info-card"><div class="info-label">Stars</div><div class="info-val" id="charStars">★★★★★</div></div>
    </div>
    <div><span class="faction-badge T" id="charFact">TRANSCENDENT</span></div>
  </div>
</div>

<script>
// ============ Config ============
const FACTIONS = ['TRANSCENDENT', 'PURIST', 'WILD', 'UNKNOWN', 'CYBERIST'];
const FACTION_COLORS = { TRANSCENDENT:'#b86bff', PURIST:'#ff6b35', WILD:'#23d160', UNKNOWN:'#3298dc', CYBERIST:'#ff3860' };
const FCLASS = { TRANSCENDENT:'T', PURIST:'P', WILD:'W', UNKNOWN:'U', CYBERIST:'C' };

const CHARS = [
  { id:'c1', name:'Adaptive Stalker', faction:'TRANSCENDENT', rarity:'SSR', hp:10850, atk:2160, def:1640, wis:1680, agi:2180, color:'#b86bff' },
  { id:'c2', name:'Purity Enforcer', faction:'PURIST', rarity:'R', hp:720, atk:140, def:130, wis:120, agi:130, color:'#ff6b35' },
  { id:'c3', name:'Fungal Overlord', faction:'WILD', rarity:'R', hp:900, atk:110, def:150, wis:100, agi:90, color:'#23d160' },
  { id:'c4', name:'Null Entity', faction:'UNKNOWN', rarity:'R', hp:650, atk:150, def:100, wis:160, agi:150, color:'#3298dc' },
  { id:'c5', name:'Chrome Revenant', faction:'CYBERIST', rarity:'R', hp:800, atk:170, def:120, wis:110, agi:140, color:'#ff3860' },
];

const CHAR_IMAGES = {
  c1: 'assets/char/char_1.jpg',
  c2: 'assets/char/char_2.jpg',
  c3: 'assets/char/char_3.jpg',
  c4: 'assets/char/char_4.jpg',
  c5: 'assets/char/char_5.jpg',
};

const CHAR_THUMBS = {
  c1: 'assets/char/char_1_s.jpg',
  c2: 'assets/char/char_2_s.jpg',
  c3: 'assets/char/char_3_s.jpg',
  c4: 'assets/char/char_4_s.jpg',
  c5: 'assets/char/char_5.jpg',
};

let idx = 0;

// ============ Babylon Scene ============
const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

const createScene = function() {
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.06, 1);

  // Camera
  const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI/2, Math.PI/3, 8, new BABYLON.Vector3(0, 1, 0), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 4;
  camera.upperRadiusLimit = 15;
  camera.lowerBetaLimit = 0.2;
  camera.upperBetaLimit = Math.PI/2 + 0.3;

  // Lights
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 0.4;
  hemi.groundColor = new BABYLON.Color3(0.1, 0.1, 0.2);

  const dir = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(-1, -2, -1), scene);
  dir.intensity = 0.6;
  dir.diffuse = new BABYLON.Color3(0.6, 0.7, 1);

  // Character plane (displays artwork)
  const charPlane = BABYLON.MeshBuilder.CreatePlane('charArt', { width: 3, height: 4 }, scene);
  charPlane.position = new BABYLON.Vector3(0, 2, 0);

  // Dynamic texture for character art
  const charMat = new BABYLON.StandardMaterial('charMat', scene);
  charMat.diffuseTexture = new BABYLON.Texture(CHAR_IMAGES.c1, scene);
  charMat.diffuseTexture.hasAlpha = false;
  charMat.emissiveColor = new BABYLON.Color3(0.8, 0.8, 0.8);
  charMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
  charPlane.material = charMat;

  // Glow plane behind character
  const glowPlane = BABYLON.MeshBuilder.CreatePlane('glow', { width: 5, height: 6 }, scene);
  glowPlane.position = new BABYLON.Vector3(0, 2, 0.5);
  const glowMat = new BABYLON.StandardMaterial('glowMat', scene);
  glowMat.emissiveColor = new BABYLON.Color3(0.7, 0.4, 1);
  glowMat.alpha = 0.15;
  glowMat.disableLighting = true;
  glowPlane.material = glowMat;

  // Ground grid
  const ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 20, height: 20 }, scene);
  const groundMat = new BABYLON.StandardMaterial('groundMat', scene);
  groundMat.diffuseColor = new BABYLON.Color3(0.05, 0.05, 0.1);
  groundMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.2);
  groundMat.emissiveColor = new BABYLON.Color3(0.02, 0.02, 0.05);
  ground.material = groundMat;
  ground.position.y = -0.5;

  // Grid lines
  for (let i = -10; i <= 10; i += 2) {
    const line1 = BABYLON.MeshBuilder.CreateLines('line', { points: [new BABYLON.Vector3(i, -0.49, -10), new BABYLON.Vector3(i, -0.49, 10)] }, scene);
    line1.color = new BABYLON.Color3(0.2, 0.2, 0.4);
    line1.alpha = 0.3;
    const line2 = BABYLON.MeshBuilder.CreateLines('line', { points: [new BABYLON.Vector3(-10, -0.49, i), new BABYLON.Vector3(10, -0.49, i)] }, scene);
    line2.color = new BABYLON.Color3(0.2, 0.2, 0.4);
    line2.alpha = 0.3;
  }

  // Floating particles
  const particleSystem = new BABYLON.ParticleSystem('particles', 500, scene);
  particleSystem.particleTexture = new BABYLON.Texture('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAGklEQVQYV2P8////fwYGBgZGRkZGBhgAMwAAIgAD/UNlrwAAAABJRU5ErkJggg==', scene);
  particleSystem.emitter = new BABYLON.Vector3(0, 2, 0);
  particleSystem.minEmitBox = new BABYLON.Vector3(-3, -1, -3);
  particleSystem.maxEmitBox = new BABYLON.Vector3(3, 3, 3);
  particleSystem.color1 = new BABYLON.Color4(0.7, 0.4, 1, 0.6);
  particleSystem.color2 = new BABYLON.Color4(0.2, 0.6, 1, 0.6);
  particleSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0);
  particleSystem.minSize = 0.02;
  particleSystem.maxSize = 0.08;
  particleSystem.minLifeTime = 2;
  particleSystem.maxLifeTime = 5;
  particleSystem.emitRate = 50;
  particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  particleSystem.gravity = new BABYLON.Vector3(0, 0.1, 0);
  particleSystem.direction1 = new BABYLON.Vector3(-0.5, 1, -0.5);
  particleSystem.direction2 = new BABYLON.Vector3(0.5, 1, 0.5);
  particleSystem.minEmitPower = 0.1;
  particleSystem.maxEmitPower = 0.3;
  particleSystem.start();

  // Floating rings around character
  for (let i = 0; i < 3; i++) {
    const ring = BABYLON.MeshBuilder.CreateTorus('ring' + i, { diameter: 4 + i * 0.8, thickness: 0.02, tessellation: 64 }, scene);
    ring.position = new BABYLON.Vector3(0, 2, 0);
    ring.rotation.x = Math.PI / 2;
    const ringMat = new BABYLON.StandardMaterial('ringMat' + i, scene);
    ringMat.emissiveColor = new BABYLON.Color3(0.4, 0.2, 1);
    ringMat.alpha = 0.3 - i * 0.08;
    ringMat.disableLighting = true;
    ring.material = ringMat;
  }

  // Animate rings
  let t = 0;
  scene.onBeforeRenderObservable.add(() => {
    t += engine.getDeltaTime() * 0.001;
    scene.meshes.forEach(m => {
      if (m.name.startsWith('ring')) {
        m.rotation.z = t * (0.5 + parseInt(m.name[3]) * 0.2);
        m.rotation.y = t * 0.3;
      }
    });
    // Subtle camera float
    camera.beta = Math.PI/3 + Math.sin(t * 0.5) * 0.05;
  });

  return scene;
};

const scene = createScene();

engine.runRenderLoop(function() {
  scene.render();
});

window.addEventListener('resize', function() {
  engine.resize();
});

// ============ UI ============
function fmt(n) { return n >= 1000 ? (n/1000).toFixed(1) + 'K' : n.toString(); }

function renderUI() {
  const c = CHARS[idx];
  document.getElementById('charName').textContent = c.name;
  document.getElementById('charLv').textContent = c.id === 'c1' ? '100' : '1';
  document.getElementById('charStars').textContent = c.id === 'c1' ? '★★★★★' : '★☆☆☆☆';
  const fb = document.getElementById('charFact');
  fb.textContent = c.faction;
  fb.style.color = FACTION_COLORS[c.faction];
  fb.style.borderColor = FACTION_COLORS[c.faction];

  const power = c.hp + c.atk + c.def + c.wis + c.agi;
  document.getElementById('powerVal').textContent = fmt(power);

  const stats = [
    { name: 'HP', value: c.hp, icon: '❤️' },
    { name: 'ATK', value: c.atk, icon: '⚔️' },
    { name: 'DEF', value: c.def, icon: '🛡️' },
    { name: 'WIS', value: c.wis, icon: '✨' },
    { name: 'AGI', value: c.agi, icon: '💨' },
  ];
  document.getElementById('statsList').innerHTML = stats.map(s =>
    `<div class="stat-row"><span class="stat-name">${s.icon} ${s.name}</span><span class="stat-val">${fmt(s.value)}</span></div>`
  ).join('');

  // Update 3D texture
  const charMat = scene.getMaterialByName('charMat');
  if (charMat && charMat.diffuseTexture) {
    charMat.diffuseTexture.dispose();
    charMat.diffuseTexture = new BABYLON.Texture(CHAR_IMAGES[c.id], scene);
  }

  // Update glow color
  const glowMat = scene.getMaterialByName('glowMat');
  if (glowMat) {
    const col = FACTION_COLORS[c.faction];
    const r = parseInt(col.slice(1,3),16)/255;
    const g = parseInt(col.slice(3,5),16)/255;
    const b = parseInt(col.slice(5,7),16)/255;
    glowMat.emissiveColor = new BABYLON.Color3(r, g, b);
  }

  // Update particle color
  const ps = scene.particleSystems[0];
  if (ps) {
    const col = FACTION_COLORS[c.faction];
    const r = parseInt(col.slice(1,3),16)/255;
    const g = parseInt(col.slice(3,5),16)/255;
    const b = parseInt(col.slice(5,7),16)/255;
    ps.color1 = new BABYLON.Color4(r, g, b, 0.6);
    ps.color2 = new BABYLON.Color4(1 - r * 0.5, 1 - g * 0.5, 1 - b * 0.5, 0.6);
  }
}

// Character select
const charSelect = document.getElementById('charSelect');
CHARS.forEach((c, i) => {
  const thumb = document.createElement('div');
  thumb.className = 'char-thumb' + (i === 0 ? ' active' : '');
  thumb.style.backgroundImage = `url(${CHAR_THUMBS[c.id]})`;
  thumb.innerHTML = `<span class="fact" style="color:${FACTION_COLORS[c.faction]}">${FCLASS[c.faction]}</span><span class="lv">Lv.${c.id==='c1'?'100':'1'}</span>`;
  thumb.onclick = () => {
    idx = i;
    document.querySelectorAll('.char-thumb').forEach((t, j) => t.classList.toggle('active', j === i));
    renderUI();
  };
  charSelect.appendChild(thumb);
});

// Layer toggle
document.querySelectorAll('.layer-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const layer = btn.dataset.layer;
    const isActive = btn.classList.contains('active');
    btn.classList.toggle('active');
    if (layer === 'scene') {
      scene.getMeshByName('charArt').setEnabled(isActive);
      scene.getMeshByName('glow').setEnabled(isActive);
    } else if (layer === 'particles') {
      scene.particleSystems[0].stop();
      if (!isActive) scene.particleSystems[0].start();
      scene.meshes.filter(m => m.name.startsWith('ring')).forEach(m => m.setEnabled(isActive));
    } else if (layer === 'hud') {
      document.getElementById('hud').style.opacity = isActive ? '0' : '1';
    } else if (layer === 'bg') {
      scene.clearColor = isActive ? new BABYLON.Color4(0, 0, 0, 1) : new BABYLON.Color4(0.02, 0.02, 0.06, 1);
      scene.getMeshByName('ground').setEnabled(!isActive);
    }
  });
});

// Buttons
document.getElementById('btnUpgrade').onclick = () => {
  const c = CHARS[idx];
  c.hp += 50; c.atk += 20; c.def += 15; c.wis += 15; c.agi += 20;
  renderUI();
};

document.getElementById('btnGacha').onclick = () => {
  const r = Math.random();
  const rarity = r < 0.03 ? 'SSR' : r < 0.13 ? 'SR' : 'R';
  const pool = CHARS.filter(c => c.rarity === rarity);
  const result = pool[Math.floor(Math.random() * pool.length)];
  alert('🎉 Pulled: ' + result.rarity + ' ' + result.name);
};

// Init
renderUI();
</script>
</body>
</html>
