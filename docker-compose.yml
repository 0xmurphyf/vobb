version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vobb-postgres
    environment:
      POSTGRES_USER: vobb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vobb_password}
      POSTGRES_DB: vobb
    ports:
      - "5432:5432"
    volumes:
      - vobb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vobb"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vobb-server
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://vobb:${DB_PASSWORD:-vobb_password}@postgres:5432/vobb?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-*}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web-demo
      dockerfile: Dockerfile
    container_name: vobb-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  vobb_pgdata:
