version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vobb-postgres
    environment:
      POSTGRES_USER: vobb
      POSTGRES_PASSWORD: vobb_password
      POSTGRES_DB: vobb
    ports:
      - "5432:5432"
    volumes:
      - vobb_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: vobb-server
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://vobb:vobb_password@postgres:5432/vobb?schema=public
      JWT_SECRET: dev-secret-change-me
      CLIENT_ORIGINS: "*"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - ./server:/app
      - /app/node_modules
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma db seed &&
             npx tsx src/index.ts"

volumes:
  vobb_data:
